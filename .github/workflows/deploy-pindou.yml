name: Deploy Pindou

on:
  push:
    branches: [main]
    paths:
      - 'apps/pindou/**'
      - 'minecraft/output/**'
      - 'minecraft/gallery/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install --filter pindou
        working-directory: .

      - run: pnpm --filter pindou build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/pindou/dist --project-name=pindou
